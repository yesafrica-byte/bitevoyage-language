<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a3554">
<title>BV 아이콘 설치 · BiteVoyage Language Quest</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./favicon-192.png">
<link rel="apple-touch-icon" href="./favicon-192.png">
<style>
*{box-sizing:border-box}
html{color-scheme:light}
body{min-height:100svh;margin:0;padding:24px;font:16px/1.65 system-ui,-apple-system,"Noto Sans KR",sans-serif;background:radial-gradient(circle at 85% 0%,#c9fbf0,transparent 38%),linear-gradient(145deg,#f5fbff,#e7f2f9);color:#12334d;display:grid;place-items:center}
main{width:min(100%,490px);background:#fff;border:1px solid #d3e5ea;border-radius:28px;padding:clamp(24px,5vw,42px);box-shadow:0 18px 52px rgba(5,55,89,.10)}
.brand{display:flex;align-items:center;gap:15px}.brand img{width:74px;height:74px;border-radius:20px;box-shadow:0 12px 30px #0941561a}
.eyebrow{font-size:12px;font-weight:850;letter-spacing:.11em;color:#08767b}
h1{margin:8px 0 0;font-size:clamp(23px,6vw,30px);line-height:1.3;color:#102f4a}
p{color:#536d7d;margin:19px 0}
button,.link{display:flex;justify-content:center;align-items:center;width:100%;border-radius:999px;min-height:52px;text-decoration:none;cursor:pointer;font-family:inherit;font-size:16px;font-weight:800;line-height:1.4}
button{background:linear-gradient(115deg,#036c88,#087e80);color:#fff;border:0;box-shadow:0 9px 20px #007c7a20;font-family:inherit;font-size:17px;font-weight:850}
button:focus-visible,.link:focus-visible{outline:3px solid #f7bb46;outline-offset:3px}
.link{color:#16415d;border:1px solid #c8dce6;background:#f5fbfe;margin-top:10px;font-family:inherit;font-size:16px;font-weight:800}
#status{min-height:24px;font-size:13px;font-weight:700;color:#146f72;margin:13px 0 0}
#note{display:none;padding:14px 16px;margin-top:12px;border-radius:16px;font-size:13px;color:#465f70;background:#edf7fa;line-height:1.7}
#note.show{display:block}
.small{font-size:13px;line-height:1.7;color:#6c7f8b}
.divider{height:1px;background:#e5eef3;margin:22px 0}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
 <div class="brand"><img alt="BiteVoyage BV 아이콘" src="./favicon-192.png" width="74" height="74"><div><div class="eyebrow">BITEVOYAGE · PREMIUM</div><h1>아이콘으로 바로 학습</h1></div></div>
 <p>홈 화면에 <b>BV 아이콘</b>을 추가해 두면 영어·일본어·중국어·한국어 여행 회화 학습 게시글로 빠르게 이동할 수 있습니다.</p>
 <button type="button" id="install">📲 BV 아이콘 설치</button>
 <div id="status" role="status" aria-live="polite"></div>
 <div id="note" role="note"></div>
 <p class="small">이미 휴대전화 홈 화면에 BV 아이콘이 있다면 재설치할 필요가 없습니다. 아이콘을 눌러 학습을 시작하세요.</p>
 <div class="divider"></div>
 <a class="link" id="learn" href="https://www.bitevoyage.com/2026/11/travel-language-quest-free-english-japanese-chinese-korean.html">🌐 지금 바로 학습하기</a>
 <p class="small" style="text-align:center;margin-bottom:0">앱스토어 가입 불필요 · 설치는 브라우저와 사용자 승인 필요 · 4개 국어 1,920개 표현</p>
</main>
<script>
(()=>{'use strict';
const LEARN_URL='https://www.bitevoyage.com/2026/11/travel-language-quest-free-english-japanese-chinese-korean.html';
const btn=document.getElementById('install'),status=document.getElementById('status'),note=document.getElementById('note');
let deferred=null,installedInSession=false;
function inform(text){status.textContent=text;}
function noteText(text){note.textContent=text;note.classList.add('show');}
function openLesson(){window.location.assign(LEARN_URL);}
function isStandalone(){return window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;}
function showManualInstructions(){
 const ua=navigator.userAgent||'';
 if(/iPad|iPhone|iPod/i.test(ua))noteText('iPhone·iPad: Safari에서 이 페이지를 연 뒤 공유 버튼 → 홈 화면에 추가 → 추가를 선택하세요. 일부 브라우저에서는 설치 버튼을 직접 제공하지 않습니다.');
 else if(/Android/i.test(ua))noteText('Android Chrome: 오른쪽 위 ⋮ → 앱 설치 또는 홈 화면에 추가 → 설치/추가를 선택하세요. 이미 BV 아이콘이 있다면 홈 화면에서 실행하세요.');
 else noteText('PC Chrome·Edge: 주소창 또는 브라우저 메뉴의 앱 설치를 이용하세요. 설치가 지원되지 않는 경우 이 페이지를 즐겨찾기에 추가할 수 있습니다.');
 inform('이 브라우저에서는 설치 승인창을 바로 호출할 수 없습니다.');
}
function markInstalled(message){installedInSession=true;deferred=null;btn.textContent='🌐 설치 완료 · 지금 학습하기';inform(message);note.classList.remove('show');}
window.addEventListener('beforeinstallprompt',(ev)=>{ev.preventDefault();deferred=ev;inform('설치 가능 · 버튼을 누르면 브라우저 설치 승인창이 열립니다.');note.classList.remove('show');});
window.addEventListener('appinstalled',()=>markInstalled('✓ 설치가 완료되었습니다. 휴대전화 홈 화면에서 BV 아이콘을 확인하세요.'));
if(isStandalone())markInstalled('✓ 현재 BV 앱으로 실행 중입니다. 학습 버튼을 눌러 시작하세요.');
btn.addEventListener('click',async()=>{
 if(installedInSession||isStandalone()){openLesson();return;}
 if(deferred){const promptEvent=deferred;deferred=null;
  try{
   await promptEvent.prompt();
   const choice=await promptEvent.userChoice;
   if(choice&&choice.outcome==='accepted')inform('설치가 승인됐습니다. 홈 화면에 BV 아이콘이 추가되는지 확인하세요.');
   else {inform('설치 요청이 취소됐습니다.');showManualInstructions();}
  }catch(e){showManualInstructions();}
  return;
 }
 if(typeof navigator.install==='function'&&window.isSecureContext){
  try{await navigator.install();btn.textContent='🌐 BV 학습 시작하기';installedInSession=true;inform('브라우저가 설치 또는 기존 앱 열기 요청을 처리했습니다. 홈 화면을 확인하세요.');note.classList.remove('show');return;}
  catch(e){if(e&&e.name==='AbortError'){inform('설치 요청이 취소됐습니다.');return;}}
 }
 showManualInstructions();
});
if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});
})();
</script>
</body>
</html>
